name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Forkspace version
      description: Settings → Forkspace shows it.
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: macOS 15, Chrome 140 / iPhone, installed app
  - type: textarea
    id: details
    attributes:
      label: Error details
      description: If the app showed "Copy details", paste them here.
      render: text
